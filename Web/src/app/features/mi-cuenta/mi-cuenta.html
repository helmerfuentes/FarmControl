<div class="page">
	<div class="page-header">
		<div>
			<h1>Mi cuenta</h1>
			<p>Sesión activa: <strong>{{ usuario() }}</strong></p>
		</div>
	</div>

	<div class="cuenta-card">
		<h2>Cambiar contraseña</h2>

		@if (errorMsg()) {
			<p class="form-error">{{ errorMsg() }}</p>
		}
		@if (successMsg()) {
			<p class="form-success">{{ successMsg() }}</p>
		}

		<form [formGroup]="form" (ngSubmit)="guardar()">
			<div class="form-group">
				<label class="form-label">Contraseña actual *</label>
				<input class="form-control" type="password" formControlName="contrasenaActual">
			</div>
			<div class="form-group">
				<label class="form-label">Contraseña nueva *</label>
				<input class="form-control" type="password" formControlName="contrasenaNueva">
				<span class="form-hint">Mínimo 6 caracteres.</span>
			</div>
			<div class="form-group">
				<label class="form-label">Confirmar contraseña nueva *</label>
				<input class="form-control" type="password" formControlName="confirmarContrasenaNueva">
				@if (form.errors?.['noCoincide'] && form.get('confirmarContrasenaNueva')?.touched) {
					<span class="form-error">Las contraseñas no coinciden.</span>
				}
			</div>
			<div class="form-actions">
				<button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
					{{ saving() ? 'Guardando…' : 'Actualizar contraseña' }}
				</button>
			</div>
		</form>
	</div>
</div>
